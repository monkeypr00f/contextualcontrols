substitutions:
  # The only values normally changed for each physical terminal.
  device_name: cc-cucina
  friendly_name: Context Dial Cucina
  terminal_id: cc_cucina
  cc_entity_prefix: sensor.contextual_controls_cc_cucina

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Generic Contextual Controls LVGL terminal"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework: { type: esp-idf }

psram: { mode: octal, speed: 80MHz }
logger:

api:
  id: ha_api
  encryption: { key: !secret api_encryption_key }
  on_client_connected: [ script.execute: render_ui ]
  on_client_disconnected: [ script.execute: render_ui ]

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret context_dial_fallback_password
captive_portal:

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO3
    frequency: 1000Hz
light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 150ms

font:
  - file: "gfonts://Roboto@700"
    id: font_value
    size: 42
    glyphs: ' !%+-.0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzàèéìòù…°'
  # A deliberately small glyph set keeps the UI quick and reliable on ESP32.
  - file: "gfonts://Roboto"
    id: font_small
    size: 13
    glyphs: ' !%+-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzàèéìòù…•›·°'
  - file: "gfonts://Roboto@500"
    id: font_medium
    size: 17
    glyphs: ' !%+-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzàèéìòù…•›·°'
  - file: "gfonts://Roboto@700"
    id: font_large
    size: 24
    glyphs: ' !%+-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzàèéìòù…•›·°'

# HA remains the source of truth for actions.  The action entities also carry
# kind/value/min/max/step attributes for diagnostics and other terminal clients.
text_sensor:
  - platform: homeassistant
    id: cc_title
    entity_id: ${cc_entity_prefix}_title
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_status
    entity_id: ${cc_entity_prefix}_status
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_mode
    entity_id: ${cc_entity_prefix}_mode
    on_value:
      then:
        - lambda: |-
            if (x == "adjust" && id(ui_view) != 4) id(ui_view) = 1;
            else if (id(ui_view) == 1) id(ui_view) = 0;
        - script.execute: render_ui
  - platform: homeassistant
    id: cc_revision
    entity_id: ${cc_entity_prefix}_revision
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_feedback
    entity_id: ${cc_entity_prefix}_feedback
    on_value:
      then:
        - if:
            condition: { lambda: 'return x == "loading" && id(ui_view) != 4;' }
            then:
              - lambda: 'id(ui_view) = 2;'
              - script.execute: render_ui
        - if:
            condition: { lambda: 'return x != "ready" && x != "adjust" && x != "loading" && id(ui_view) != 4;' }
            then:
              - lambda: 'id(ui_view) = 3;'
              - script.execute: render_ui
              - script.execute: feedback_timeout
  - platform: homeassistant
    id: cc_action_1
    entity_id: ${cc_entity_prefix}_action_1
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_action_2
    entity_id: ${cc_entity_prefix}_action_2
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_action_3
    entity_id: ${cc_entity_prefix}_action_3
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_action_4
    entity_id: ${cc_entity_prefix}_action_4
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_action_5
    entity_id: ${cc_entity_prefix}_action_5
    on_value: [ script.execute: render_ui ]

  - platform: homeassistant
    id: cc_kind_1
    entity_id: ${cc_entity_prefix}_action_1
    attribute: kind
    internal: true
  - platform: homeassistant
    id: cc_kind_2
    entity_id: ${cc_entity_prefix}_action_2
    attribute: kind
    internal: true
  - platform: homeassistant
    id: cc_kind_3
    entity_id: ${cc_entity_prefix}_action_3
    attribute: kind
    internal: true
  - platform: homeassistant
    id: cc_kind_4
    entity_id: ${cc_entity_prefix}_action_4
    attribute: kind
    internal: true
  - platform: homeassistant
    id: cc_kind_5
    entity_id: ${cc_entity_prefix}_action_5
    attribute: kind
    internal: true
  - platform: homeassistant
    id: cc_target_1
    entity_id: ${cc_entity_prefix}_action_1
    attribute: entity_id
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_target_2
    entity_id: ${cc_entity_prefix}_action_2
    attribute: entity_id
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_target_3
    entity_id: ${cc_entity_prefix}_action_3
    attribute: entity_id
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_target_4
    entity_id: ${cc_entity_prefix}_action_4
    attribute: entity_id
    on_value: [ script.execute: render_ui ]
  - platform: homeassistant
    id: cc_target_5
    entity_id: ${cc_entity_prefix}_action_5
    attribute: entity_id
    on_value: [ script.execute: render_ui ]

globals:
  - { id: selected_slot, type: int, restore_value: no, initial_value: '0' }
  # 0 list, 1 value control, 2 loading, 3 result, 4 Display settings
  - { id: ui_view, type: int, restore_value: no, initial_value: '0' }
  - { id: last_activity, type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: screen_awake, type: bool, restore_value: no, initial_value: 'true' }
  - { id: brightness_percent, type: int, restore_value: yes, initial_value: '100' }

script:
  - id: wake_display
    mode: restart
    then:
      - lambda: |-
          id(last_activity) = millis();
          id(screen_awake) = true;
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return id(brightness_percent) / 100.0f;'
      - script.execute: render_ui

  - id: render_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: ui_title
          text: !lambda 'return id(cc_title).state.empty() ? std::string("CONTEXT DIAL") : id(cc_title).state;'
      - lvgl.label.update:
          id: ui_status
          text: !lambda |-
            if (id(cc_revision).state.empty())
              return std::string(id(ha_api).is_connected() ? "Attendo il contesto…" : "Offline · riconnessione");
            return id(cc_status).state;
      - lvgl.label.update:
          id: ui_wifi
          text: !lambda 'return std::string(id(ha_api).is_connected() ? "ONLINE" : "OFFLINE");'
      - lvgl.label.update:
          id: ui_previous
          text: !lambda |-
            int s = (id(selected_slot) + 4) % 5;
            std::string a[5] = {id(cc_action_1).state, id(cc_action_2).state, id(cc_action_3).state, id(cc_action_4).state, id(cc_action_5).state};
            return a[s].empty() ? std::string("") : a[s] + "  ›";
      - lvgl.label.update:
          id: ui_current
          text: !lambda |-
            std::string a[5] = {id(cc_action_1).state, id(cc_action_2).state, id(cc_action_3).state, id(cc_action_4).state, id(cc_action_5).state};
            return a[id(selected_slot)].empty() ? std::string("Nessuna azione") : a[id(selected_slot)] + "  ›";
      - lvgl.label.update:
          id: ui_next
          text: !lambda |-
            int s = (id(selected_slot) + 1) % 5;
            std::string a[5] = {id(cc_action_1).state, id(cc_action_2).state, id(cc_action_3).state, id(cc_action_4).state, id(cc_action_5).state};
            return a[s].empty() ? std::string("") : a[s] + "  ›";
      - lvgl.label.update:
          id: ui_page
          text: !lambda |-
            std::string a[5] = {id(cc_action_1).state, id(cc_action_2).state, id(cc_action_3).state, id(cc_action_4).state, id(cc_action_5).state};
            int count = 0, position = 0;
            for (int i = 0; i < 5; i++) {
              if (!a[i].empty()) {
                count++;
                if (i <= id(selected_slot)) position++;
              }
            }
            return std::to_string(position) + " / " + std::to_string(count);
      - lvgl.label.update:
          id: ui_adjust_name
          text: !lambda |-
            std::string a[5] = {id(cc_action_1).state, id(cc_action_2).state, id(cc_action_3).state, id(cc_action_4).state, id(cc_action_5).state};
            auto label = a[id(selected_slot)];
            return label.empty() ? std::string("Controllo") : label.substr(0, label.rfind(": "));
      - lvgl.label.update:
          id: ui_adjust_value
          text: !lambda |-
            std::string a[5] = {id(cc_action_1).state, id(cc_action_2).state, id(cc_action_3).state, id(cc_action_4).state, id(cc_action_5).state};
            auto label = a[id(selected_slot)];
            auto split = label.rfind(": ");
            return split == std::string::npos ? std::string("…") : label.substr(split + 2);
      - lvgl.label.update:
          id: ui_action_icon
          text: !lambda |-
            std::string targets[5] = {id(cc_target_1).state, id(cc_target_2).state, id(cc_target_3).state, id(cc_target_4).state, id(cc_target_5).state};
            auto target = targets[id(selected_slot)];
            if (target.find("light.") == 0) return std::string("\uF0E7");
            if (target.find("climate.") == 0) return std::string("\uF043");
            if (target.find("media_player.") == 0) return std::string("\uF028");
            if (target.find("cover.") == 0) return std::string("\uF077");
            return std::string("\uF013");
      - lvgl.widget.update:
          id: action_card
          border_color: !lambda |-
            std::string targets[5] = {id(cc_target_1).state, id(cc_target_2).state, id(cc_target_3).state, id(cc_target_4).state, id(cc_target_5).state};
            return lv_color_hex(targets[id(selected_slot)].find("light.") == 0 ? 0xF6D45B : 0x3BA7F0);
      - lvgl.label.update:
          id: ui_feedback_text
          text: !lambda |-
            return std::string(id(cc_feedback).state == "ok" ? "Fatto" :
              (id(cc_feedback).state == "stale" ? "Lista aggiornata" : "Operazione non disponibile"));
      - lvgl.label.update:
          id: ui_brightness
          text: !lambda 'return std::to_string(id(brightness_percent)) + "%";'
      - lvgl.bar.update:
          id: brightness_bar
          value: !lambda 'return id(brightness_percent);'
      - if:
          condition: { lambda: 'return id(ui_view) == 0;' }
          then: [ lvgl.widget.show: menu_group ]
          else: [ lvgl.widget.hide: menu_group ]
      - if:
          condition: { lambda: 'return id(ui_view) == 1;' }
          then: [ lvgl.widget.show: adjust_group ]
          else: [ lvgl.widget.hide: adjust_group ]
      - if:
          condition: { lambda: 'return id(ui_view) == 2;' }
          then: [ lvgl.widget.show: loading_group ]
          else: [ lvgl.widget.hide: loading_group ]
      - if:
          condition: { lambda: 'return id(ui_view) == 3;' }
          then: [ lvgl.widget.show: feedback_group ]
          else: [ lvgl.widget.hide: feedback_group ]
      - if:
          condition: { lambda: 'return id(ui_view) == 4;' }
          then: [ lvgl.widget.show: settings_group ]
          else: [ lvgl.widget.hide: settings_group ]

  - id: feedback_timeout
    mode: restart
    then:
      - delay: 1600ms
      - lambda: 'if (id(ui_view) == 3) id(ui_view) = 0;'
      - script.execute: render_ui

  # No executable entity ID crosses this boundary: HA receives a stable slot,
  # delta and generation only, then resolves the slot again at execution time.
  - id: send_select
    parameters: { delta: int }
    then:
      - if:
          condition: { api.connected: }
          then:
            - homeassistant.action:
                action: contextual_controls.terminal_input
                data:
                  terminal: ${terminal_id}
                  input: select
                data_template:
                  slot: "{{ slot }}"
                  delta: "{{ delta }}"
                  revision: "{{ revision }}"
                variables:
                  slot: !lambda 'return id(selected_slot) + 1;'
                  delta: !lambda 'return delta;'
                  revision: !lambda 'return id(cc_revision).state;'
  - id: send_activate
    then:
      - if:
          condition: { api.connected: }
          then:
            - homeassistant.action:
                action: contextual_controls.terminal_input
                data:
                  terminal: ${terminal_id}
                data_template:
                  input: "{{ input_name }}"
                  slot: "{{ slot }}"
                  revision: "{{ revision }}"
                variables:
                  input_name: !lambda |-
                    std::string kinds[5] = {id(cc_kind_1).state, id(cc_kind_2).state, id(cc_kind_3).state, id(cc_kind_4).state, id(cc_kind_5).state};
                    return std::string(kinds[id(selected_slot)] == "LIGHT" && id(cc_mode).state != "adjust" ? "adjust" : "activate");
                  slot: !lambda 'return id(selected_slot) + 1;'
                  revision: !lambda 'return id(cc_revision).state;'
  - id: send_back
    then:
      - if:
          condition: { api.connected: }
          then:
            - homeassistant.action:
                action: contextual_controls.terminal_input
                data:
                  terminal: ${terminal_id}
                  input: back
                data_template:
                  revision: "{{ revision }}"
                variables:
                  revision: !lambda 'return id(cc_revision).state;'

  - id: encoder_turn
    parameters: { delta: int }
    then:
      # The first physical input after standby does not select, adjust, or send.
      - if:
          condition: { lambda: 'return !id(screen_awake);' }
          then: [ script.execute: wake_display ]
          else:
            - script.execute: wake_display
            - lambda: |-
                id(last_activity) = millis();
                if (id(ui_view) == 4)
                  id(brightness_percent) = std::max(10, std::min(100, id(brightness_percent) + delta * 10));
                else if (id(ui_view) == 0) {
                  std::string a[5] = {id(cc_action_1).state, id(cc_action_2).state, id(cc_action_3).state, id(cc_action_4).state, id(cc_action_5).state};
                  for (int n = 0; n < 5; n++) {
                    id(selected_slot) = (id(selected_slot) + (delta > 0 ? 1 : 4)) % 5;
                    if (!a[id(selected_slot)].empty()) break;
                  }
                }
            - if:
                condition: { lambda: 'return id(ui_view) == 0 || id(ui_view) == 1;' }
                then:
                  - script.execute: { id: send_select, delta: !lambda 'return delta;' }
            - if:
                condition: { lambda: 'return id(ui_view) == 4;' }
                then:
                  - light.turn_on:
                      id: backlight
                      brightness: !lambda 'return id(brightness_percent) / 100.0f;'
            - script.execute: render_ui

  - id: encoder_click
    then:
      - if:
          condition: { lambda: 'return !id(screen_awake);' }
          then: [ script.execute: wake_display ]
          else:
            - script.execute: wake_display
            - lambda: |-
                id(last_activity) = millis();
                if (id(ui_view) == 4) id(ui_view) = 0;
                else if (id(ui_view) == 0) id(ui_view) = 2;
            - if:
                condition: { lambda: 'return id(ui_view) == 1 || id(ui_view) == 2;' }
                then: [ script.execute: send_activate ]
            - script.execute: render_ui

  - id: process_single_ko
    then:
      - script.execute: wake_display
      - lambda: |-
          id(last_activity) = millis();
          if (id(ui_view) == 4 || id(ui_view) == 3 || id(ui_view) == 2 || id(ui_view) == 1) id(ui_view) = 0;
      - script.execute: send_back
      - script.execute: render_ui

sensor:
  - platform: rotary_encoder
    id: context_encoder
    pin_a: { number: GPIO4, mode: { input: true, pullup: true } }
    pin_b: { number: GPIO5, mode: { input: true, pullup: true } }
    resolution: 1
    on_clockwise: [ script.execute: { id: encoder_turn, delta: 1 } ]
    on_anticlockwise: [ script.execute: { id: encoder_turn, delta: -1 } ]

binary_sensor:
  - platform: gpio
    id: encoder_push
    pin: { number: GPIO6, mode: { input: true, pullup: true }, inverted: true }
    filters: [ delayed_on: 20ms, delayed_off: 20ms ]
    on_click:
      min_length: 20ms
      max_length: 350ms
      then: [ script.execute: encoder_click ]
  - platform: gpio
    id: key_button
    pin: { number: GPIO7, mode: { input: true, pullup: true }, inverted: true }
    filters: [ delayed_on: 20ms, delayed_off: 20ms ]
    on_multi_click:
      # Use ESPHome's recognizer instead of a hand-rolled millis timer: the
      # latter could commit the first click before a normal human double-click.
      - timing:
          - ON for at most 300ms
          - OFF for at most 350ms
          - ON for at most 300ms
          - OFF for at least 120ms
        then:
          - if:
              condition: { lambda: 'return !id(screen_awake);' }
              then: [ script.execute: wake_display ]
              else:
                - script.execute: wake_display
                - lambda: |-
                    id(last_activity) = millis();
                    id(ui_view) = 4;
                - script.execute: render_ui
      - timing:
          - ON for at most 300ms
          - OFF for at least 450ms
        then:
          - if:
              condition: { lambda: 'return !id(screen_awake);' }
              then: [ script.execute: wake_display ]
              else: [ script.execute: process_single_ko ]

interval:
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t idle = millis() - id(last_activity);
          if (idle >= 120000 && id(screen_awake)) {
            id(screen_awake) = false;
            auto call = id(backlight).turn_off();
            call.set_transition_length(700);
            call.perform();
          } else if (idle >= 30000 && id(screen_awake)) {
            auto call = id(backlight).turn_on();
            call.set_brightness(std::min(0.15f, id(brightness_percent) / 100.0f));
            call.set_transition_length(700);
            call.perform();
          }

display:
  - platform: mipi_spi
    id: context_display
    model: ST7789V
    invert_colors: true
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO8
    data_rate: 20MHz
    auto_clear_enabled: false
    update_interval: never

lvgl:
  displays: context_display
  rotation: 0
  buffer_size: 25%
  bg_color: 0x0B0D12
  on_boot:
    - script.execute: render_ui
  theme:
    obj:
      pad_all: 0
      scrollbar_mode: "OFF"
      scrollable: false
  widgets:
    - label: { id: ui_title, x: 14, y: 12, width: 212, text_font: font_medium, text_color: 0xF2F5F8, long_mode: SCROLL_CIRCULAR, text: "CONTEXT DIAL" }
    - label: { id: ui_status, x: 14, y: 61, width: 212, text_font: font_small, text_color: 0x9CA6B5, long_mode: DOT, text: "Attendo il contesto…" }
    - label: { id: ui_wifi, x: 164, y: 40, width: 62, text_align: RIGHT, text_font: font_small, text_color: 0x68D391, text: "ONLINE" }
    - obj:
        id: menu_group
        width: 240
        height: 320
        bg_opa: TRANSP
        border_width: 0
        widgets:
          - obj:
              x: 24
              y: 99
              width: 192
              height: 35
              radius: 10
              bg_color: 0x151B25
              border_width: 0
              widgets:
                - label: { id: ui_previous, x: 14, y: 9, width: 164, text_font: font_small, text_color: 0x8B95A5, long_mode: DOT, text: "" }
          - obj:
              id: action_card
              x: 12
              y: 150
              width: 216
              height: 86
              radius: 14
              bg_color: 0x142B40
              border_color: 0x3BA7F0
              border_width: 2
              widgets:
                - label: { id: ui_action_icon, x: 14, y: 26, width: 34, text_font: montserrat_28, text_color: 0xF6D45B, text: "\uF013" }
                - label: { id: ui_current, x: 56, y: 20, width: 144, height: 54, text_font: font_medium, text_color: 0xFFFFFF, long_mode: DOT, text: "Nessuna azione" }
          - obj:
              x: 24
              y: 248
              width: 192
              height: 35
              radius: 10
              bg_color: 0x151B25
              border_width: 0
              widgets:
                - label: { id: ui_next, x: 14, y: 9, width: 164, text_font: font_small, text_color: 0x8B95A5, long_mode: DOT, text: "" }
          - label: { id: ui_page, x: 14, y: 300, width: 55, text_font: font_small, text_color: 0x9CA6B5, text: "1 / 5" }
          - label: { x: 75, y: 300, width: 150, text_align: RIGHT, text_font: font_small, text_color: 0x9CA6B5, text: "2 KO: Display ESP" }
    - obj:
        id: adjust_group
        hidden: true
        width: 240
        height: 320
        bg_opa: TRANSP
        border_width: 0
        widgets:
          - label: { id: ui_adjust_name, x: 18, y: 100, width: 204, text_align: CENTER, text_font: font_medium, text_color: 0xFFFFFF, long_mode: DOT, text: "Controllo" }
          - label: { id: ui_adjust_value, x: 18, y: 144, width: 204, text_align: CENTER, text_font: font_value, text_color: 0x63B3ED, text: "…" }
          - label: { x: 0, y: 255, width: 240, text_align: CENTER, text_font: font_small, text_color: 0x9CA6B5, text: "Ruota: regola   Click: fine" }
          - label: { x: 0, y: 285, width: 240, text_align: CENTER, text_font: font_small, text_color: 0x657083, text: "KO: torna ai controlli" }
    - obj:
        id: loading_group
        hidden: true
        width: 240
        height: 320
        bg_opa: TRANSP
        border_width: 0
        widgets:
          - label: { x: 0, y: 153, width: 240, text_align: CENTER, text_font: font_medium, text_color: 0x63B3ED, text: "Invio comando…" }
    - obj:
        id: feedback_group
        hidden: true
        width: 240
        height: 320
        bg_opa: TRANSP
        border_width: 0
        widgets:
          - label: { id: ui_feedback_text, x: 0, y: 147, width: 240, text_align: CENTER, text_font: font_large, text_color: 0x68D391, text: "Fatto" }
    - obj:
        id: settings_group
        hidden: true
        width: 240
        height: 320
        bg_opa: TRANSP
