reset_learning:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: contextual_controls
    entity_id:
      selector:
        entity: {}
    mode:
      required: true
      default: all
      selector:
        select:
          options:
            - all
            - historical
            - sequence
            - feedback
            - user
            - entity
    user_id:
      selector:
        text: {}
    confirm:
      required: true
      default: false
      selector:
        boolean: {}

get_learning_stats:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: contextual_controls
    entity_id:
      selector:
        entity: {}
    user_id:
      selector:
        text: {}

get_slot:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: contextual_controls
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box

execute_slot:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: contextual_controls
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box
    expected_entity_id:
      selector:
        entity: {}
    mode:
      required: true
      default: automatic
      selector:
        select:
          options:
            - automatic
            - more_info
            - execute
    confirmed:
      required: true
      default: false
      selector:
        boolean: {}
    source:
      required: true
      default: unknown
      selector:
        select:
          options:
            - apple_watch
            - ios_lock_screen
            - shortcut
            - action_button
            - control_center
            - unknown

terminal_input:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: contextual_controls
    terminal:
      required: true
      selector:
        text: {}
    input:
      required: true
      selector:
        select:
          options:
            - select
            - activate
            - adjust
            - back
    slot:
      selector:
        number:
          min: 1
          max: 20
          mode: box
    delta:
      selector:
        number:
          min: -20
          max: 20
          mode: box
    revision:
      selector:
        text: {}

refresh_terminal:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: contextual_controls
    terminal:
      required: true
      selector:
        text: {}
